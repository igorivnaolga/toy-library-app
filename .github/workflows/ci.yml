name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, audit & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: toylib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toylib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/toylib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests migrations

      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements-prod.txt

      - name: Apply migrations to a throwaway Postgres
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d toylib -v ON_ERROR_STOP=1 -f tests/integration/supabase_stubs.sql
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Run pytest (unit + Postgres integration)
        run: python -m pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root and backend Dockerfiles are in sync
        run: python scripts/check_dockerfiles_in_sync.py

      - name: Build backend/ image
        run: docker build -t toy-library-api:backend backend

      - name: Build repo-root image
        run: docker build -t toy-library-api:root .

      - name: Image runs as non-root and serves /health
        run: |
          test "$(docker run --rm --entrypoint id toy-library-api:backend -u)" != "0"
          docker run -d --name api -p 8000:8000 toy-library-api:backend
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  mobile:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
