name: Member push reminders

# Calls the hosted API cron endpoint. Set repository secrets:
#   PRODUCTION_API_URL  e.g. https://your-api.up.railway.app
#   CRON_SECRET         same value as backend CRON_SECRET
#
# The API sends reminders only during its Pacific/Auckland slot hours
# (17:00 duty/event eve, 18:00 pickup/return eve, 09:00 morning; first 45 min)
# and de-duplicates sends, so we call at every UTC hour that maps to a slot in
# either NZST (UTC+12) or NZDT (UTC+13). Off-slot calls are no-ops; this stays
# correct across daylight-saving changes. Each call also runs missed-pickup cleanup.
#
#   NZ slot   NZST (UTC+12)   NZDT (UTC+13)
#   17:00     05:00 UTC       04:00 UTC
#   18:00     06:00 UTC       05:00 UTC
#   09:00     21:00 UTC       20:00 UTC

on:
  schedule:
    - cron: "5 4,5,6,20,21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: POST member reminder cron
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set PRODUCTION_API_URL and CRON_SECRET repository secrets to enable."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${API_URL%/}/api/v1/admin/notifications/send-member-reminders/cron" \
            || { echo "Cron request failed (see response body above)."; exit 1; }
